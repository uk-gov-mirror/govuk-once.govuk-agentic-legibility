[project]
name = "agentic-legibility"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "boto3>=1.43.40",
    "boto3-stubs[secretsmanager,ssm]>=1.43.44",
    "docstring-parser>=0.18.0",
    "dotenv>=0.9.9",
    "fastapi>=0.128.2",
    "mypy>=2.1.0",
    "pyjwt>=2.13.0",
    "pyotp>=2.10.0",
    "pytest-asyncio>=1.4.0",
    "requests>=2.34.2",
    "strands-agents>=1.50.2",
    "uvicorn>=0.48.0",
]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-testdox>=3.1.0",
    "ruff>=0.15.20",
]

[tool.pytest.ini_options]
pythonpath = "."

[tool.mypy]
mypy_path = "."
explicit_package_bases = true

[tool.uv.workspace]
members = [
    "durable_poc",
]
